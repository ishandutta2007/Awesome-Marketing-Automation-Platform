<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="16" fill="url(#bg)"/>

  <!-- Background Abstract Dynamic Elements -->
  <g opacity="0.3">
    <!-- Glowing circles -->
    <circle cx="150" cy="50" r="100" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="170" r="120" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Animated Flow Lines in background -->
    <path d="M 50 180 Q 300 80, 600 180 T 1150 100" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 100 40 Q 400 160, 800 40 T 1100 180" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Decorative Flow Nodes (Sides/Background) -->
  <g opacity="0.6" stroke="#6366f1" stroke-width="1">
    <rect x="50" y="30" width="130" height="35" rx="6" fill="url(#cardGrad)"/>
    <text x="115" y="52" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">⚡ Email Triggers</text>
    
    <rect x="1010" y="35" width="140" height="35" rx="6" fill="url(#cardGrad)"/>
    <text x="1080" y="57" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">🎯 Lead Scoring</text>

    <rect x="50" y="155" width="150" height="35" rx="6" fill="url(#cardGrad)"/>
    <text x="125" y="177" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">📊 Customer Journeys</text>

    <rect x="990" y="150" width="160" height="35" rx="6" fill="url(#cardGrad)"/>
    <text x="1070" y="172" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">🔓 Open-Source &amp; SaaS</text>
  </g>

  <!-- FOREGROUND CONTENT -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="440" y="28" width="320" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="600" y="45" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">🚀 CURATED MARKETING AUTOMATION PLATFORMS</text>

    <!-- Main Title -->
    <text x="600" y="105" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome Marketing Automation Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="145" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Top SaaS Products &amp; Open-Source Projects for Email Campaigns, Lead Nurturing &amp; Customer Journeys
    </text>

    <!-- Subtitle Tech Pills -->
    <g transform="translate(0, 168)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <text x="600" y="12" fill="#94a3b8">
        <tspan fill="#38bdf8">⚡ Mautic</tspan> • 
        <tspan fill="#818cf8">✉️ Listmonk</tspan> • 
        <tspan fill="#c084fc">📈 HubSpot</tspan> • 
        <tspan fill="#f472b6">🛍️ Klaviyo</tspan> • 
        <tspan fill="#34d399">📬 ActiveCampaign</tspan>
      </text>
    </g>
  </g>
</svg>
